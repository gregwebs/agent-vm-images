name: Verify released standard image boot (amd64)

# Real msb boot of a PUBLISHED standard release on a hosted ubuntu-24.04 runner:
# unlock /dev/kvm, provision the pinned standalone msb runtime, then run the signed
# source's own verify-release.sh --boot. Read-only: contents:read, no secrets, no
# GHCR login, no environment. amd64 only: ubuntu-24.04-arm exposes no /dev/kvm, so
# arm64 boot evidence stays a native-host step. A green run is amd64 evidence for
# maintainer review, never promotion. See docs/standard-image-releases.md.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      expected_source_sha:
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      version:
        description: Published standard image version (MAJOR.MINOR.PATCH)
        type: string
        required: true
  # Pre-merge exercise against an already published version, mirroring the
  # test/release-standard/** rehearsal: test/release-boot/<VERSION>[/<name>].
  push:
    branches:
      - 'test/release-boot/**'

permissions:
  contents: read

jobs:
  # Real reusable interface: contracts.yml has workflow_call with no inputs/secrets.
  # Deliberately runs again on release calls; standalone push/dispatch must not bypass it.
  contracts:
    uses: ./.github/workflows/contracts.yml
  boot-amd64:
    needs: contracts
    runs-on: ubuntu-24.04
    # Initial phase floors + upload reserve; retune per docs/standard-image-releases.md.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        timeout-minutes: 5
        with:
          path: harness
          persist-credentials: false
      - name: Bind requested version and require this repository's harness
        id: bind
        timeout-minutes: 2
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # The runner context is unavailable in job-level env; bind run-owned paths first
          # so the always() evidence steps see them even if a later check here fails.
          { echo "ASSETS=$RUNNER_TEMP/release-assets"; echo "RUNTIME_LOGS=$RUNNER_TEMP/boot-runtime"; } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/boot-runtime"
          test "$GITHUB_REPOSITORY" = gregwebs/agent-vm-images
          test "$(git -C harness rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git -C harness status --porcelain)"
          if [ -n "$VERSION_INPUT" ]; then
            version=$VERSION_INPUT
          else
            case "$GITHUB_REF" in
              refs/heads/test/release-boot/*) ;;
              *) echo "no version input and not a release-boot ref: $GITHUB_REF" >&2; exit 1 ;;
            esac
            version=${GITHUB_REF#refs/heads/test/release-boot/}
            version=${version%%/*}
          fi
          # Match the whole string; explicit exit also fails closed under Bash 3.2.
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Provision pinned verifier tools
        timeout-minutes: 20
        run: |
          set -euo pipefail
          bash harness/script/release/install-ci-tools.sh 2>&1 | tee "$RUNTIME_LOGS/tools.log"
      - name: Require containerd image store on this disposable runner
        timeout-minutes: 5
        run: |
          set -euo pipefail
          bash harness/script/release/prepare-ci.sh 2>&1 | tee "$RUNTIME_LOGS/containerd.log"
      - name: Reclaim listed runner SDKs and grant /dev/kvm (amd64 only)
        timeout-minutes: 12
        run: |
          set -euo pipefail
          bash harness/script/release/prepare-ci-boot.sh "$RUNTIME_LOGS"
      - name: Provision pinned standalone msb runtime
        id: msb
        timeout-minutes: 11
        run: |
          set -euo pipefail
          bash harness/script/release/install-ci-msb.sh 2>&1 | tee "$RUNTIME_LOGS/install-msb.log"
      - name: Download and authenticate release assets anonymously; bind signed source
        id: release
        timeout-minutes: 30
        env:
          VERSION: ${{ steps.bind.outputs.version }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          set -euo pipefail
          # Bound the WHOLE download, including all repeated transfers and attestations.
          python3 harness/script/test/host-watchdog.py 1740 bash harness/script/release/download-release.sh \
            --version "$VERSION" --arch amd64 --out "$ASSETS" \
            2>&1 | tee "$RUNTIME_LOGS/download-release.log"
          # release.json is authenticated by download-release (signer workflow, main ref, hosted runner).
          sha=$(jq -er .source_sha "$ASSETS/release.json")
          printf '%s\n' "$sha" | grep -Eq '^[0-9a-f]{40}$'
          if [ -n "$EXPECTED_SOURCE_SHA" ] && [ "$sha" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "signed source $sha is not the expected $EXPECTED_SOURCE_SHA" >&2; exit 1
          fi
          echo "source_sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        timeout-minutes: 5
        with:
          ref: ${{ steps.release.outputs.source_sha }}
          path: source
          persist-credentials: false
      - name: Require exact signed source checkout
        timeout-minutes: 2
        env:
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git -C source status --porcelain)"
      - name: Native amd64 boot verification with the signed source's own gate
        id: verify
        timeout-minutes: 242
        env:
          VERSION: ${{ steps.bind.outputs.version }}
          MSB: ${{ steps.msb.outputs.msb }}
          # Reviewed runtime declaration (script/release/tool-pins.json): libkrun is
          # statically linked into the pinned msb; install-ci-msb.sh and verify.py
          # both refuse this declaration if ldd resolves a libkrun.
          MSB_LIBKRUNFW_PATH: ${{ steps.msb.outputs.libkrunfw }}
          MSB_LIBKRUN_VERSION: ${{ steps.msb.outputs.libkrun_version }}
          MSB_LIBKRUN_EMBEDDED: '1'
        run: |
          set -euo pipefail
          python3 harness/script/test/host-watchdog.py 14400 bash source/script/release/verify-release.sh \
            --version "$VERSION" --arch amd64 --assets-dir "$ASSETS" --msb-bin "$MSB" --boot \
            2>&1 | tee "$RUNTIME_LOGS/verify-release.log"
          # Exit 0 without the record is not success.
          compgen -G "$ASSETS/verify-amd64-*/verification-amd64.json" >/dev/null
      - name: Stage hash-bound evidence (never turns failure green)
        if: always()
        timeout-minutes: 3
        env:
          MSB_DIR: ${{ steps.msb.outputs.dir }}
        run: |
          set -euo pipefail
          : "${ASSETS:=$RUNNER_TEMP/release-assets}" "${RUNTIME_LOGS:=$RUNNER_TEMP/boot-runtime}"
          bash harness/script/release/stage-ci-boot-evidence.sh "$ASSETS" "$RUNTIME_LOGS" "$MSB_DIR" "$RUNNER_TEMP/boot-evidence"
      - name: Validate staged amd64 success record and every inventoried log
        # Still validate after a staging failure; upload follows even if this fails.
        if: ${{ always() && steps.verify.outcome == 'success' }}
        timeout-minutes: 4
        env:
          VERSION: ${{ steps.bind.outputs.version }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: |
          set -euo pipefail
          status=0
          python3 harness/script/test/host-watchdog.py 180 python3 harness/script/release/check-ci-boot-evidence.py \
            "$GITHUB_WORKSPACE/source" "$ASSETS" "$RUNNER_TEMP/boot-evidence" "$VERSION" "$SOURCE_SHA" \
            2>&1 | tee "$RUNTIME_LOGS/staged-validation.log" || status=$?
          # Retain the validation error even on failure; never mask the checker's status.
          if ! cp -p "$RUNTIME_LOGS/staged-validation.log" "$RUNNER_TEMP/boot-evidence/runtime/"; then status=1; fi
          exit "$status"
      - name: Upload boot evidence (never turns failure green)
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boot-amd64-v${{ steps.bind.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/boot-evidence/
          if-no-files-found: warn
          # Promotion input awaiting maintainer review; longer than the 7-day build evidence.
          retention-days: 30
      - name: Boot evidence summary
        if: always()
        timeout-minutes: 2
        env:
          VERSION: ${{ steps.bind.outputs.version }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          JOB_VERDICT: ${{ job.status }}
        run: |
          set -euo pipefail
          {
            echo "Standard image v${VERSION:-?} linux/amd64 hosted boot verification; verdict: $JOB_VERDICT"
            echo "Signed source: ${SOURCE_SHA:-unresolved}; harness: $GITHUB_SHA"
            echo "Runtime: $(jq -r '"msb " + .msb_version + ", libkrunfw " + .libkrunfw_version + ", " + .msb_libkrun_version' harness/script/release/tool-pins.json)"
            echo 'arm64 boot: NOT RUN on hosted CI (ubuntu-24.04-arm exposes no /dev/kvm); native-host step.'
            echo 'Upstream microsandbox runtime, not the launcher msb. Evidence for maintainer review; not promotion.'
          } >> "$GITHUB_STEP_SUMMARY"
