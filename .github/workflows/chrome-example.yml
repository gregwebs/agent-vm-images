name: Chrome example (native)
on:
  pull_request:
    # Direct inputs of this suite: the example build context, the harness, its control, the
    # shared supervisor, the builder guard, the apt helper and the reusable contracts caller.
    # Filtering here does NOT drop the contract gate: contracts.yml also runs standalone on
    # every PR/push. It only skips rebuilding Chromium when no Chrome input changed.
    paths: ['examples/layers/chrome-devtools/**', 'script/test/chrome-example.sh',
            'script/test/chrome-example-watchdog.sh', 'script/test/fixtures/chrome-example/**',
            'script/test/host-watchdog.py', 'script/test/require-daemon-builder.sh',
            'script/ci/apt-install.sh', '.github/workflows/chrome-example.yml',
            '.github/workflows/contracts.yml']
  push:
    branches: [main]
    # Same list as above (actionlint rejects YAML aliases for `paths`).
    paths: ['examples/layers/chrome-devtools/**', 'script/test/chrome-example.sh',
            'script/test/chrome-example-watchdog.sh', 'script/test/fixtures/chrome-example/**',
            'script/test/host-watchdog.py', 'script/test/require-daemon-builder.sh',
            'script/ci/apt-install.sh', '.github/workflows/chrome-example.yml',
            '.github/workflows/contracts.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    uses: ./.github/workflows/contracts.yml          # repo convention for expensive workflows (CONTRIBUTING.md:230-232)
  native:
    needs: contracts
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # PROVISIONAL bounds: 5 checkout + 20 prerequisites + 60 suite + 13 arm64 control + 5 summary + 10 upload = 113,
    # inside a 120-minute job so setup and post-steps keep a 7-minute margin. The suite watchdog (3300 s) is
    # 300 s under its 60-minute step bound. Both watchdogs use 110 s grace (it must exceed the suite's 90-second
    # cleanup budget); even two escalation windows fit: suite 3300 + 220 < 3600 s; control 600 + 220 < 780 s.
    # Summary/upload keep their own budgets. This suite installs a package from the registry and derives images,
    # so it is materially longer than PR A's browser-only run.
    # Replace with >= 1.5x the first green per-arch durations (keep these floors).
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        timeout-minutes: 5
        with:
          persist-credentials: false
      - name: Prerequisites
        timeout-minutes: 20
        run: bash script/ci/apt-install.sh jq coreutils python3
      - name: Chrome example suite
        timeout-minutes: 60
        env:
          NATIVE_ARCH: ${{ matrix.arch }}
          CHROME_EXAMPLE_WATCHDOG_GRACE_SECONDS: 110
        run: |
          mkdir -p target/ci-logs
          set -o pipefail
          python3 script/test/host-watchdog.py --grace-seconds 110 3300 bash script/test/chrome-example.sh \
            --platform "linux/$NATIVE_ARCH" --evidence-dir target/ci-logs/chrome-example 2>&1 | tee target/ci-logs/chrome-example.log
      - name: Interrupted-run watchdog control
        if: matrix.arch == 'arm64'
        timeout-minutes: 13
        run: |
          BASE_IMAGE=$(jq -er '.[0].Id' target/ci-logs/chrome-example/parent-inspect.log)
          export BASE_IMAGE
          set -o pipefail
          # PROVISIONAL: the three per-case watchdogs (60 s each plus 110 s grace) worst-case ~510 s,
          # so 600 s bounds them; 600 s plus two 110 s escalation windows stays under this 780 s step.
          EVIDENCE_DIR=target/ci-logs/chrome-watchdog python3 script/test/host-watchdog.py --grace-seconds 110 600 \
            bash script/test/chrome-example-watchdog.sh 2>&1 | tee target/ci-logs/chrome-watchdog.log
      - name: Evidence summary
        if: always()
        timeout-minutes: 5
        env:
          SOURCE_SHA: ${{ github.sha }}
          NATIVE_ARCH: ${{ matrix.arch }}
          JOB_VERDICT: ${{ job.status }}
        run: |
          mkdir -p target/ci-logs
          {
            echo "Source SHA: $SOURCE_SHA; native platform: linux/$NATIVE_ARCH; verdict: $JOB_VERDICT"
            echo 'Failed, NOT-RUN or absent phases are NOT acceptance.'
            for f in evidence.txt verdicts.txt durations.txt; do
              if [ -f "target/ci-logs/chrome-example/$f" ]; then cat "target/ci-logs/chrome-example/$f"; else echo "missing: $f"; fi
            done
          } | tee target/ci-logs/summary.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload evidence
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chrome-example-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/ci-logs/
          if-no-files-found: error
