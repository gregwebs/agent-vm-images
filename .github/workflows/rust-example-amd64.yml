name: Rust example (amd64, one-off)

# TEMPORARY evidence run for #102: a native linux/amd64 row for the rust-dev
# example. It exists only on the pull-request branch, runs the shared harness
# (all evidence logic lives in script/test/rust-example.sh), and is deleted in a
# follow-up commit before merge. Permanent multi-example CI stays with #33.
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    # The harness self-supervises with a 45-minute suite watchdog and a bounded
    # cleanup phase; this job bound leaves setup/teardown margin above it.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        timeout-minutes: 5
        with:
          persist-credentials: false
      - name: Rust example suite
        timeout-minutes: 75
        env:
          NATIVE_ARCH: amd64
        run: |
          mkdir -p target/ci-logs
          set -o pipefail
          bash script/test/rust-example.sh --platform linux/amd64 --no-cache 2>&1 | tee target/ci-logs/rust-example.log
      - name: Evidence summary
        if: always()
        timeout-minutes: 5
        env:
          SOURCE_SHA: ${{ github.sha }}
          JOB_VERDICT: ${{ job.status }}
        run: |
          mkdir -p target/ci-logs
          {
            echo "Source SHA: $SOURCE_SHA; native platform: linux/amd64; verdict: $JOB_VERDICT"
            echo 'Failed, NOT-RUN or absent phases are NOT acceptance.'
            find target/rust-example -maxdepth 2 -name 'harness.log' -o -name 'durations.txt' 2>/dev/null | sort | while read -r f; do
              echo "== $f"; cat "$f"
            done
          } | tee target/ci-logs/summary.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload evidence
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-example-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/ci-logs/
            target/rust-example/
          if-no-files-found: error
