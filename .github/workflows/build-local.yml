name: Native local images
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    uses: ./.github/workflows/contracts.yml
  native:
    needs: contracts
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 380
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        timeout-minutes: 10
        with:
          # go.mod is the single source of truth for the language version; the
          # selected patch release comes from its toolchain line (see the next step).
          go-version-file: images/recipe-contract/go.mod
          # Dependencies are vendored and built with -mod=vendor, so no module
          # cache is needed; the vendor drift gate in contracts.sh downloads
          # through GOPROXY/GOSUMDB.
          cache: false
      - name: Assert the go.mod toolchain
        timeout-minutes: 10
        run: bash script/ci/assert-go-toolchain.sh
      - name: Audit prerequisites
        timeout-minutes: 20
        run: bash script/ci/apt-install.sh jq coreutils python3
      # Bounded steps, counted in the job total: 10 (setup-go) + 10 (toolchain
      # assertion) + 20 (prerequisites) + 20 (capacity) + 180 (build) + 120 (audit)
      # + 10 (evidence upload) = 370 <= 380.
      # Every host watchdog is shorter than its own step bound (1200 -> 1150, 10800
      # -> 10600, 7200 -> 6900 = the audit bound minus 300), so the watchdog always
      # fires first and its termination still has margin before the step timeout.
      # The audit step runs the consumer legs serially, including the Pi and bridge
      # preparation-policy matrices; its internal provisional budget
      # (AUDIT_BUDGET_SECONDS) must be replaced by the first measured green sum.
      - name: Native capacity and builder
        timeout-minutes: 20
        env:
          NATIVE_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p target/ci-logs
          set -o pipefail
          python3 script/test/host-watchdog.py 1150 bash script/test/ci-native.sh prepare "$NATIVE_ARCH" 2>&1 | tee target/ci-logs/capacity.log
      - name: build
        timeout-minutes: 180
        env:
          NATIVE_ARCH: ${{ matrix.arch }}
        run: |
          set -o pipefail
          python3 script/test/host-watchdog.py 10600 bash script/test/ci-native.sh build "$NATIVE_ARCH" 2>&1 | tee target/ci-logs/build-phase.log
      - name: audit
        timeout-minutes: 120
        env:
          NATIVE_ARCH: ${{ matrix.arch }}
        run: |
          set -o pipefail
          python3 script/test/host-watchdog.py 6900 bash script/test/ci-native.sh audit "$NATIVE_ARCH" 2>&1 | tee target/ci-logs/audit-phase.log
      - name: Evidence summary
        if: always()
        env:
          SOURCE_SHA: ${{ github.sha }}
          NATIVE_ARCH: ${{ matrix.arch }}
          JOB_VERDICT: ${{ job.status }}
        run: |
          {
            echo "Image source SHA: $SOURCE_SHA"
            echo "Migration source: 3ec78eebb7bdf743c93942a6ed2e5510de15c52d"
            echo "Native platform: linux/$NATIVE_ARCH; verdict: $JOB_VERDICT"
            echo 'Failed or absent phases are NOT acceptance; see capacity/build/audit logs.'
            if [ -f target/ci-logs/durations.txt ]; then cat target/ci-logs/durations.txt; fi
            if [ -f target/ci-logs/verdicts.txt ]; then cat target/ci-logs/verdicts.txt; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload evidence (no image archive)
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-local-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          # An extraction used by the layout oracle carries a link to `/` (the
          # container's fixture alias), and the uploader follows links: never let
          # a working tree like that into the artifact. Evidence is the reports.
          path: |
            target/ci-logs/
            !target/ci-logs/**/image-root/**
          if-no-files-found: warn
