name: Image contracts
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # Full history: docs/standard-pnpm-migration.json is checked against a
      # generator that reads the baseline lock object (6c51509) through git.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        timeout-minutes: 10
        with:
          # go.mod is the single source of truth for the language version; the
          # selected patch release comes from its toolchain line (see the next step).
          go-version-file: images/recipe-contract/go.mod
          # Dependencies are vendored and built with -mod=vendor, so no module
          # cache is needed; the vendor drift gate in contracts.sh downloads
          # through GOPROXY/GOSUMDB.
          cache: false
      - name: Assert the go.mod toolchain
        timeout-minutes: 10
        run: bash script/ci/assert-go-toolchain.sh
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1 (2026-08-05)
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - name: Contributor prerequisites
        timeout-minutes: 20
        run: |
          # bubblewrap confines the rust-toolchain fixture children; the
          # isolation control refuses rather than silently weakening when it is
          # absent (#102).
          bash script/ci/apt-install.sh jq coreutils python3 bubblewrap
          bash script/dev/install-shellcheck.sh "$RUNNER_TEMP/shellcheck"
          echo "$RUNNER_TEMP/shellcheck" >> "$GITHUB_PATH"
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          # The exact linter, built by the toolchain go.mod selects; contracts.sh
          # fails on any other version.
          bash script/dev/install-golangci-lint.sh
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Hermetic and static gates
        run: bash script/test/contracts.sh
